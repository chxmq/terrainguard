# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Deploy: Dashboard → New → Blueprint → connect repo → Deploy Blueprint
#
# Env vars: edit envVars below and redeploy, OR set in Render Dashboard → Environment.

services:
  - type: web
    name: terrain-guard
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TTCI_SOURCE
        value: tiles
