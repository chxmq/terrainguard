<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var key = "terrain-guard-theme";
        var mode = localStorage.getItem(key);
        if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "system";
        var dark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.dataset.theme = mode;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#07080a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Terrain Guard — TTCI Assessment</title>
    <meta name="description" content="Terrain Topography Complexity Index — validated terrain risk for aviation safety." />
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" class="absolute overflow-hidden">
      <filter id="grain-noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
